trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infrastructure/terraform/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infrastructure/terraform/**

variables:
- group: uptimehub-terraform-dev

- name: azureServiceConnection
  value: 'uptimehub-azure-dev'

- name: terraformVersion
  value: '1.16.2'

- name: terraformDirectory
  value: 'infrastructure/terraform/environments/dev'

- name: terraformPlan
  value: 'uptimehub-dev.tfplan'

pool:
  vmImage: 'ubuntu-latest'


# =========================================================
# 1. TERRAFORM VALIDATE
# =========================================================
stages:

- stage: Validate
  displayName: 'Terraform Validate'

  jobs:
  - job: TerraformValidate
    displayName: 'Validate Infrastructure'

    steps:
    - checkout: self

    - script: |
        set -euo pipefail

        TERRAFORM_VERSION="$(terraformVersion)"

        curl -fsSLo terraform.zip \
          "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

        unzip -q terraform.zip

        sudo install terraform /usr/local/bin/terraform

        terraform version
      displayName: 'Install Terraform'

    - script: |
        terraform fmt -check -recursive
      workingDirectory: 'infrastructure/terraform'
      displayName: 'Terraform Format Check'

    - task: AzureCLI@2
      displayName: 'Terraform Init and Validate'

      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true

        inlineScript: |
          set -euo pipefail

          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$tenantId"
          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN="$idToken"

          terraform init \
            -backend-config=backend.hcl \
            -input=false

          terraform validate

        workingDirectory: '$(terraformDirectory)'


# =========================================================
# 2. TERRAFORM PLAN
# =========================================================

- stage: Plan
  displayName: 'Terraform Plan'
  dependsOn: Validate
  condition: succeeded()

  jobs:
  - job: TerraformPlan
    displayName: 'Plan Infrastructure Changes'

    steps:
    - checkout: self

    - script: |
        set -euo pipefail

        TERRAFORM_VERSION="$(terraformVersion)"

        curl -fsSLo terraform.zip \
          "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

        unzip -q terraform.zip

        sudo install terraform /usr/local/bin/terraform

        terraform version
      displayName: 'Install Terraform'

    - task: AzureCLI@2
      displayName: 'Create Terraform Plan'

      env:
        TF_VAR_postgresql_admin_password: $(TF_VAR_postgresql_admin_password)

      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true

        inlineScript: |
          set -euo pipefail

          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$tenantId"
          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN="$idToken"

          terraform init \
            -backend-config=backend.hcl \
            -input=false

          terraform plan \
            -input=false \
            -out="$(terraformPlan)"

        workingDirectory: '$(terraformDirectory)'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'

      inputs:
        targetPath: '$(terraformDirectory)/$(terraformPlan)'
        artifact: 'terraform-plan'


# =========================================================
# 3. APPROVAL + TERRAFORM APPLY
# =========================================================

- stage: Apply
  displayName: 'Terraform Apply'
  dependsOn: Plan
  condition: succeeded()

  jobs:
  - deployment: TerraformApply
    displayName: 'Apply Infrastructure Changes'

    environment: 'uptimehub-infrastructure-dev'

    strategy:
      runOnce:
        deploy:

          steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'

            inputs:
              artifact: 'terraform-plan'
              path: '$(Pipeline.Workspace)/terraform-plan'

          - script: |
              set -euo pipefail

              TERRAFORM_VERSION="$(terraformVersion)"

              curl -fsSLo terraform.zip \
                "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

              unzip -q terraform.zip

              sudo install terraform /usr/local/bin/terraform

              terraform version
            displayName: 'Install Terraform'

          - task: AzureCLI@2
            displayName: 'Apply Terraform Plan'

            env:
              TF_VAR_postgresql_admin_password: $(TF_VAR_postgresql_admin_password)

            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true

              inlineScript: |
                set -euo pipefail

                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                export ARM_USE_OIDC=true
                export ARM_OIDC_TOKEN="$idToken"

                terraform init \
                  -backend-config=backend.hcl \
                  -input=false

                terraform apply \
                  -input=false \
                  -auto-approve \
                  "$(Pipeline.Workspace)/terraform-plan/$(terraformPlan)"

              workingDirectory: '$(terraformDirectory)'
