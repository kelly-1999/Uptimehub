trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  azureServiceConnection: 'uptimehub-azure-dev'
  resourceGroup: 'rg-uptimehub-dev'
  aksCluster: 'aks-uptimehub-dev'
  imageRepository: 'uptimehub-backend'
  dockerfilePath: 'application/backend/Dockerfile'
  imageTag: '$(Build.BuildId)'

pool:
  vmImage: 'ubuntu-latest'

stages:

# =========================================================
# 1. TEST
# =========================================================
- stage: Test
  displayName: 'Test UptimeHub'
  jobs:
  - job: BackendTests
    displayName: 'Backend Tests'
    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.14'
      displayName: 'Use Python 3.14'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
      workingDirectory: 'application/backend'
      displayName: 'Install dependencies'

    - script: |
        pytest -v
      workingDirectory: 'application/backend'
      displayName: 'Run backend tests'
      env:
        DATABASE_URL: 'postgresql+psycopg://uptimehub:uptimehub@localhost:5432/uptimehub_test'
        REDIS_URL: 'redis://localhost:6379/0'
        ENVIRONMENT: 'test'
        DEBUG: 'false'

# =========================================================
# 2. BUILD + PUSH
# =========================================================
- stage: Build
  displayName: 'Build and Push Image'
  dependsOn: Test
  condition: succeeded()

  jobs:
  - job: DockerBuild
    displayName: 'Docker Build and Push'
    steps:

    - task: AzureCLI@2
      displayName: 'Build and push image to ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          ACR_NAME=$(az acr list \
            --resource-group "$(resourceGroup)" \
            --query "[0].name" \
            --output tsv)

          ACR_LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --query loginServer \
            --output tsv)

          echo "Building image:"
          echo "$ACR_LOGIN_SERVER/$(imageRepository):$(imageTag)"

          az acr login --name "$ACR_NAME"

          docker build \
            -t "$ACR_LOGIN_SERVER/$(imageRepository):$(imageTag)" \
            -f "$(dockerfilePath)" \
            application/backend

          docker push \
            "$ACR_LOGIN_SERVER/$(imageRepository):$(imageTag)"

          echo "##vso[task.setvariable variable=acrLoginServer;isOutput=true]$ACR_LOGIN_SERVER"
      name: buildImage


# =========================================================
# 3. DEPLOY
# =========================================================
- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()

  variables:
    acrLoginServer: $[ stageDependencies.Build.DockerBuild.outputs['buildImage.acrLoginServer'] ]

  jobs:
  - deployment: DeployUptimeHub
    displayName: 'Deploy UptimeHub'
    environment: 'uptimehub-dev'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy to AKS'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az aks install-cli

                az aks get-credentials \
                  --resource-group "$(resourceGroup)" \
                  --name "$(aksCluster)" \
                  --overwrite-existing

                IMAGE="$(acrLoginServer)/$(imageRepository):$(imageTag)"

                echo "Deploying:"
                echo "$IMAGE"

                kubectl apply -k kubernetes/base/

                kubectl set image \
                  deployment/uptimehub-backend \
                  backend="$IMAGE" \
                  -n uptimehub-dev

                kubectl set image \
                  deployment/uptimehub-scheduler \
                  scheduler="$IMAGE" \
                  -n uptimehub-dev

                kubectl set image \
                  deployment/uptimehub-worker \
                  worker="$IMAGE" \
                  -n uptimehub-dev

                kubectl set image \
                  job/uptimehub-db-migration \
                  migration="$IMAGE" \
                  -n uptimehub-dev \
                  --local \
                  -o yaml | kubectl replace --force -f -

                kubectl wait \
                  --for=condition=complete \
                  job/uptimehub-db-migration \
                  -n uptimehub-dev \
                  --timeout=180s

                kubectl rollout status \
                  deployment/uptimehub-backend \
                  -n uptimehub-dev \
                  --timeout=300s

                kubectl rollout status \
                  deployment/uptimehub-scheduler \
                  -n uptimehub-dev \
                  --timeout=300s

                kubectl rollout status \
                  deployment/uptimehub-worker \
                  -n uptimehub-dev \
                  --timeout=300s


# =========================================================
# 4. SMOKE TEST
# =========================================================
- stage: SmokeTest
  displayName: 'Smoke Test'
  dependsOn: Deploy
  condition: succeeded()

  jobs:
  - job: HealthCheck
    displayName: 'UptimeHub Health Check'

    steps:

    - task: AzureCLI@2
      displayName: 'Test Application Gateway endpoint'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          PUBLIC_IP=$(az network public-ip list \
            --resource-group "$(resourceGroup)" \
            --query "[?contains(name, 'agw-uptimehub-dev')].ipAddress | [0]" \
            --output tsv)

          test -n "$PUBLIC_IP"

          echo "Testing UptimeHub health endpoint..."

          curl \
            --fail \
            --show-error \
            --retry 5 \
            --retry-delay 10 \
            "http://$PUBLIC_IP/health"

          echo
          echo "UptimeHub smoke test passed."
