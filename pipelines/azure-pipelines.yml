trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  azureServiceConnection: 'uptimehub-azure-dev'
  resourceGroup: 'rg-uptimehub-dev'
  aksCluster: 'aks-uptimehub-dev'
  imageRepository: 'uptimehub-backend'
  dockerfilePath: 'application/backend/Dockerfile'
  imageTag: '$(Build.BuildId)'

pool:
  vmImage: 'ubuntu-latest'


# =========================================================
# 1. TEST
# =========================================================
stages:
- stage: Test
  displayName: 'Test UptimeHub'

  jobs:
  - job: BackendTests
    displayName: 'Backend Tests'

    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.14'
      displayName: 'Use Python 3.14'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
      workingDirectory: 'application/backend'
      displayName: 'Install dependencies'

    - script: |
        pytest -v
      workingDirectory: 'application/backend'
      displayName: 'Run backend tests'
      env:
        DATABASE_URL: 'postgresql+psycopg://uptimehub:uptimehub@localhost:5432/uptimehub_test'
        REDIS_URL: 'redis://localhost:6379/0'
        ENVIRONMENT: 'test'
        DEBUG: 'false'


# =========================================================
# 2. BUILD + PUSH
# =========================================================
- stage: Build
  displayName: 'Build and Push Image'
  dependsOn: Test
  condition: succeeded()

  jobs:
  - job: DockerBuild
    displayName: 'Docker Build and Push'

    steps:
    - task: AzureCLI@2
      displayName: 'Build and push image to ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          ACR_NAME=$(az acr list \
            --resource-group "$(resourceGroup)" \
            --query "[0].name" \
            --output tsv)

          ACR_LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --query loginServer \
            --output tsv)

          IMAGE="$ACR_LOGIN_SERVER/$(imageRepository):$(imageTag)"

          echo "Building image:"
          echo "$IMAGE"

          az acr login --name "$ACR_NAME"

          docker build \
            -t "$IMAGE" \
            -f "$(dockerfilePath)" \
            application/backend

          docker push "$IMAGE"

          echo "##vso[task.setvariable variable=acrLoginServer;isOutput=true]$ACR_LOGIN_SERVER"

      name: buildImage


# =========================================================
# 3. DEPLOY TO AKS
# =========================================================
- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()

  variables:
    acrLoginServer: $[ stageDependencies.Build.DockerBuild.outputs['buildImage.acrLoginServer'] ]

  jobs:
  - deployment: DeployUptimeHub
    displayName: 'Deploy UptimeHub'
    environment: 'uptimehub-dev'

    strategy:
      runOnce:
        deploy:

          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy to AKS'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript

              inlineScript: |
                set -euo pipefail

                # -------------------------------------------------
                # Connect pipeline to AKS
                # -------------------------------------------------
                az aks install-cli

                az aks get-credentials \
                  --resource-group "$(resourceGroup)" \
                  --name "$(aksCluster)" \
                  --overwrite-existing

                IMAGE="$(acrLoginServer)/$(imageRepository):$(imageTag)"

                echo "Deploying:"
                echo "$IMAGE"


                # -------------------------------------------------
                # Delete previous migration Job
                #
                # Kubernetes Job pod templates are immutable.
                # -------------------------------------------------
                kubectl delete job uptimehub-db-migration \
                  -n uptimehub-dev \
                  --ignore-not-found=true \
                  --wait=true


                # -------------------------------------------------
                # Apply Kubernetes configuration
                # -------------------------------------------------
                kubectl apply -k kubernetes/base/


                # -------------------------------------------------
                # Deploy the new application image
                # -------------------------------------------------
                kubectl set image \
                  deployment/uptimehub-backend \
                  backend="$IMAGE" \
                  -n uptimehub-dev

                kubectl set image \
                  deployment/uptimehub-scheduler \
                  scheduler="$IMAGE" \
                  -n uptimehub-dev

                kubectl set image \
                  deployment/uptimehub-worker \
                  worker="$IMAGE" \
                  -n uptimehub-dev


                # -------------------------------------------------
                # Recreate migration using THIS pipeline image
                # -------------------------------------------------
                kubectl delete job uptimehub-db-migration \
                  -n uptimehub-dev \
                  --ignore-not-found=true \
                  --wait=true

                sed \
                  "s|image: .*uptimehub-backend:.*|image: $IMAGE|" \
                  kubernetes/base/migration-job.yaml \
                  | kubectl apply -f -


                # -------------------------------------------------
                # Wait for database migration
                # -------------------------------------------------
                echo "Waiting for database migration..."

                kubectl wait \
                  --for=condition=complete \
                  job/uptimehub-db-migration \
                  -n uptimehub-dev \
                  --timeout=180s

                echo "Database migration completed."


                # -------------------------------------------------
                # Wait for application rollouts
                # -------------------------------------------------
                echo "Waiting for backend rollout..."

                kubectl rollout status \
                  deployment/uptimehub-backend \
                  -n uptimehub-dev \
                  --timeout=300s

                echo "Waiting for scheduler rollout..."

                kubectl rollout status \
                  deployment/uptimehub-scheduler \
                  -n uptimehub-dev \
                  --timeout=300s

                echo "Waiting for worker rollout..."

                kubectl rollout status \
                  deployment/uptimehub-worker \
                  -n uptimehub-dev \
                  --timeout=300s

                echo "AKS deployment completed successfully."


# =========================================================
# 4. SMOKE TEST
# =========================================================
- stage: SmokeTest
  displayName: 'Smoke Test'
  dependsOn: Deploy
  condition: succeeded()

  jobs:
  - job: HealthCheck
    displayName: 'UptimeHub Health Check'

    steps:
    - script: |
        set -euo pipefail

        echo "Testing UptimeHub through Application Gateway..."

        curl \
          --fail \
          --show-error \
          --retry 6 \
          --retry-delay 10 \
          --retry-all-errors \
          "http://$(APPGW_PUBLIC_IP)/health"

        echo
        echo "UptimeHub smoke test passed."


