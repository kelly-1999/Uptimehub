trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  azureServiceConnection: 'uptimehub-azure-dev'
  resourceGroup: 'rg-uptimehub-dev'
  aksCluster: 'aks-uptimehub-dev'
  imageRepository: 'uptimehub-backend'
  dockerfilePath: 'application/backend/Dockerfile'
  imageTag: '$(Build.BuildId)'

pool:
  vmImage: 'ubuntu-latest'


# =========================================================
# 1. TEST
# =========================================================
stages:
- stage: Test
  displayName: 'Test UptimeHub'

  jobs:
  - job: BackendTests
    displayName: 'Backend Tests'

    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.14'
      displayName: 'Use Python 3.14'

    - script: |
        set -euo pipefail

        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
      workingDirectory: 'application/backend'
      displayName: 'Install dependencies'

    - script: |
        set -euo pipefail

        pytest -v
      workingDirectory: 'application/backend'
      displayName: 'Run backend tests'

      env:
        DATABASE_URL: 'postgresql+psycopg://uptimehub:uptimehub@localhost:5432/uptimehub_test'
        REDIS_URL: 'redis://localhost:6379/0'
        ENVIRONMENT: 'test'
        DEBUG: 'false'


# =========================================================
# 2. SECURITY SCAN
# =========================================================
- stage: Security
  displayName: 'Security Scan'
  dependsOn: Test
  condition: succeeded()

  jobs:
  - job: RepositorySecurity
    displayName: 'Repository Security Scan'

    steps:
    - checkout: self

    - script: |
        set -euo pipefail

        echo "Installing Trivy..."

        sudo apt-get update
        sudo apt-get install -y wget gnupg lsb-release

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy

        trivy --version
      displayName: 'Install Trivy'

    - script: |
        set -euo pipefail

        echo "Scanning repository dependencies and files..."

        trivy fs \
          --scanners vuln \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          .
      displayName: 'Scan dependencies'

    - script: |
        set -euo pipefail

        echo "Scanning Terraform, Kubernetes and Docker configuration..."

        trivy config \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          infrastructure/terraform kubernetes application/backend/Dockerfile
      displayName: 'Scan IaC and configuration'


# =========================================================
# 3. BUILD + PUSH
# =========================================================
- stage: Build
  displayName: 'Build and Push Image'
  dependsOn: Security
  condition: succeeded()

  jobs:
  - job: DockerBuild
    displayName: 'Docker Build and Push'

    steps:
    - task: AzureCLI@2
      name: buildImage
      displayName: 'Build and push image to ACR'

      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |
          set -euo pipefail

          ACR_NAME=$(az acr list \
            --resource-group "$(resourceGroup)" \
            --query "[0].name" \
            --output tsv)

          ACR_LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --query loginServer \
            --output tsv)

          IMAGE="$ACR_LOGIN_SERVER/$(imageRepository):$(imageTag)"

          echo "Building:"
          echo "$IMAGE"

          az acr login --name "$ACR_NAME"

          docker build \
            -t "$IMAGE" \
            -f "$(dockerfilePath)" \
            application/backend

          docker push "$IMAGE"

          echo "##vso[task.setvariable variable=acrLoginServer;isOutput=true]$ACR_LOGIN_SERVER"


# =========================================================
# 4. CONTAINER IMAGE SECURITY
# =========================================================
- stage: ContainerSecurity
  displayName: 'Container Security Scan'
  dependsOn: Build
  condition: succeeded()

  variables:
    acrLoginServer: $[ stageDependencies.Build.DockerBuild.outputs['buildImage.acrLoginServer'] ]

  jobs:
  - job: ContainerScan
    displayName: 'Scan Docker Image'

    steps:
    - script: |
        set -euo pipefail

        echo "Installing Trivy..."

        sudo apt-get update
        sudo apt-get install -y wget gnupg lsb-release

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy

        trivy --version
      displayName: 'Install Trivy'

    - task: AzureCLI@2
      displayName: 'Scan container image'

      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |
          set -euo pipefail

          ACR_NAME=$(echo "$(acrLoginServer)" | cut -d'.' -f1)

          IMAGE="$(acrLoginServer)/$(imageRepository):$(imageTag)"

          echo "Authenticating to ACR..."

          az acr login --name "$ACR_NAME"

          echo "Pulling image for security scan..."

          docker pull "$IMAGE"

          echo "Scanning container image..."

          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$IMAGE"


# =========================================================
# 5. DEPLOY
# =========================================================
- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn:
    - Build
    - ContainerSecurity
  condition: succeeded()

  variables:
    acrLoginServer: $[ stageDependencies.Build.DockerBuild.outputs['buildImage.acrLoginServer'] ]

  jobs:
  - deployment: DeployUptimeHub
    displayName: 'Deploy UptimeHub'
    environment: 'uptimehub-dev'

    strategy:
      runOnce:
        deploy:

          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy to AKS'

            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript

              inlineScript: |
                set -euo pipefail

                az aks install-cli

                az aks get-credentials \
                  --resource-group "$(resourceGroup)" \
                  --name "$(aksCluster)" \
                  --overwrite-existing

                IMAGE="$(acrLoginServer)/$(imageRepository):$(imageTag)"

                echo "Deploying:"
                echo "$IMAGE"

                # -------------------------------------------------
                # Jobs cannot have their pod template modified.
                # Remove the previous migration before deployment.
                # -------------------------------------------------
                kubectl delete job uptimehub-db-migration \
                  -n uptimehub-dev \
                  --ignore-not-found=true \
                  --wait=true


                # -------------------------------------------------
                # Build manifests using THIS pipeline image.
                # Nothing is applied yet.
                # -------------------------------------------------
                mkdir -p /tmp/uptimehub-k8s

                kubectl kustomize kubernetes/base/ \
                  | sed "s|image: .*uptimehub-backend:.*|image: $IMAGE|g" \
                  > /tmp/uptimehub-k8s/deployment.yaml


                # -------------------------------------------------
                # Apply the complete rendered configuration once.
                # -------------------------------------------------
                kubectl apply \
                  -f /tmp/uptimehub-k8s/deployment.yaml


                # -------------------------------------------------
                # Database migration must succeed before we accept
                # the application deployment as successful.
                # -------------------------------------------------
                echo "Waiting for database migration..."

                kubectl wait \
                  --for=condition=complete \
                  job/uptimehub-db-migration \
                  -n uptimehub-dev \
                  --timeout=180s

                echo "Database migration completed."


                # -------------------------------------------------
                # Verify Kubernetes rollouts
                # -------------------------------------------------
                echo "Waiting for backend rollout..."

                kubectl rollout status \
                  deployment/uptimehub-backend \
                  -n uptimehub-dev \
                  --timeout=300s

                echo "Waiting for scheduler rollout..."

                kubectl rollout status \
                  deployment/uptimehub-scheduler \
                  -n uptimehub-dev \
                  --timeout=300s

                echo "Waiting for worker rollout..."

                kubectl rollout status \
                  deployment/uptimehub-worker \
                  -n uptimehub-dev \
                  --timeout=300s

                echo "AKS deployment completed successfully."


# =========================================================
# 6. SMOKE TEST
# =========================================================
- stage: SmokeTest
  displayName: 'Smoke Test'
  dependsOn: Deploy
  condition: succeeded()

  jobs:
  - job: HealthCheck
    displayName: 'UptimeHub Health Check'

    steps:
    - script: |
        set -euo pipefail

        echo "Testing UptimeHub through Application Gateway..."

        curl \
          --fail \
          --show-error \
          --retry 6 \
          --retry-delay 10 \
          --retry-all-errors \
          "http://$(APPGW_PUBLIC_IP)/health"

        echo
        echo "UptimeHub smoke test passed."

      displayName: 'Test Application Gateway endpoint'
