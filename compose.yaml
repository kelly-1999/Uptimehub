services:
  alertmanager:
    image: prom/alertmanager:latest

    environment:
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
      ALERT_EMAIL_PASSWORD: ${ALERT_EMAIL_PASSWORD}

    volumes:
      - ./monitoring/alerts/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./monitoring/alerts/entrypoint.sh:/entrypoint.sh:ro
      - alertmanager_data:/alertmanager

    entrypoint:
      - /bin/sh
      - /entrypoint.sh

    ports:
      - "9093:9093"

    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    depends_on:
      - backend
      - worker
      - scheduler

    restart: unless-stopped

  redis:
    image: redis:8-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  migrate:
    build:
      context: ./application/backend

    image: uptimehub-backend:dev

    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      ENVIRONMENT: ${ENVIRONMENT}
      DEBUG: ${DEBUG}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    command:
      - alembic
      - upgrade
      - head

    depends_on:
      postgres:
        condition: service_healthy


  backend:
    build:
      context: ./application/backend

    image: uptimehub-backend:dev

    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      ENVIRONMENT: ${ENVIRONMENT}
      DEBUG: ${DEBUG}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0

    ports:
      - "8000:8000"

    depends_on:
      redis:
        condition: service_healthy

      postgres:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    restart: unless-stopped


  scheduler:
    expose:
      - "9102"
    build:
      context: ./application/backend

    image: uptimehub-backend:dev

    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      ENVIRONMENT: ${ENVIRONMENT}
      DEBUG: ${DEBUG}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0

    command:
      - python
      - -m
      - app.services.monitor_scheduler

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    restart: unless-stopped


  worker:
    expose:
      - "9101"
    build:
      context: ./application/backend

    image: uptimehub-backend:dev

    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      ENVIRONMENT: ${ENVIRONMENT}
      DEBUG: ${DEBUG}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0

    command:
      - python
      - -m
      - app.services.monitor_worker

    depends_on:
      redis:
        condition: service_healthy

      postgres:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
