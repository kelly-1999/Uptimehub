apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: uptimehub-keyvault
  namespace: uptimehub-dev
spec:
  provider: azure

  secretObjects:
    - secretName: uptimehub-secrets
      type: Opaque
      data:
        - objectName: database-url
          key: DATABASE_URL
        - objectName: redis-url
          key: REDIS_URL

  parameters:
    usePodIdentity: "false"
    clientID: "30e35826-ce23-4087-932a-7d321df92625"
    keyvaultName: "kv-uptimehub-x51qfz"
    tenantId: "1f716c0a-8f58-4f9c-84ba-ffe951e15d15"

    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: redis-url
          objectType: secret
